name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    name: Resolve GitVersion package version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate GitVersion 6.8.2
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install GitVersion.Tool --tool-path "$RUNNER_TEMP/gitversion" --version 6.8.2
          version="$("$RUNNER_TEMP/gitversion/dotnet-gitversion" /showvariable MajorMinorPatch)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
  offline:
    needs: version
    name: Offline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate repository metadata and documentation
        run: python scripts/check_project.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q Ejix scripts tests
      - name: Build source and add-in archives
        run: |
          python scripts/build.py --channel release --version "${{ needs.version.outputs.version }}"
          python scripts/build.py --kind addin --channel release --version "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Ejix-packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
