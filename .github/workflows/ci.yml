name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    name: Resolve GitVersion package version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve GitVersion (shared platform)
        id: gitversion
        uses: 4FusionLab/.github/.github/actions/resolve-version@ad9d60ba4aabc494b4f2c85d6c566a50ca423751

  offline:
    needs: version
    name: Offline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate repository metadata and documentation
        run: python scripts/check_project.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q Ejix scripts tests
      - name: Build source and add-in archives
        run: |
          python scripts/build.py --channel release --version "${{ needs.version.outputs.version }}"
          python scripts/build.py --kind addin --channel release --version "${{ needs.version.outputs.version }}"
      - name: Verify source and add-in ZIPs (shared contract)
        uses: 4FusionLab/.github/.github/actions/verify-archive@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          product: Ejix
          version: ${{ needs.version.outputs.version }}
          archives: |
            dist/Ejix-${{ needs.version.outputs.version }}-source.zip
            dist/Ejix-${{ needs.version.outputs.version }}.zip
          manifest: Ejix/Ejix.manifest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Ejix-packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
