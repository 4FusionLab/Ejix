name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  offline:
    name: Offline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate repository metadata and documentation
        run: python scripts/check_project.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q Ejix scripts tests
      - name: Build source and add-in archives
        run: |
          python scripts/build.py --channel release
          python scripts/build.py --kind addin --channel release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Ejix-packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
