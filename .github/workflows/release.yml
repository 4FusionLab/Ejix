name: Publish release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ejix-release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  changes:
    name: Check runtime changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.impact.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect runtime changes (shared platform)
        id: impact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: 4FusionLab/.github/.github/actions/runtime-changes@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          before: ${{ github.event.before }}
          after: ${{ github.sha }}
          paths-file: .github/release-paths.txt

  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [validate, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Calculate version and determine release channel
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install GitVersion.Tool --tool-path "$RUNNER_TEMP/gitversion" --version 6.8.2
          version="$("$RUNNER_TEMP/gitversion/dotnet-gitversion" /showvariable MajorMinorPatch)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          channel=stable
          tag="v$version"
          # Never claim stable CAD acceptance for a changed runtime digest.
          if ! python scripts/check_project.py --version "$version" --stable >/dev/null 2>&1; then
            channel=prerelease
            tag="v$version-beta.$GITHUB_RUN_NUMBER"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          python scripts/release_notes.py --product Ejix --version "$version" \
            --output "$RUNNER_TEMP/release-notes.md" --candidate "docs/releases/$version.md"
      - name: Validate release and build assets
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          package_channel=prerelease
          if [[ "$RELEASE_CHANNEL" == stable ]]; then
            flags+=(--stable)
            package_channel=release
          fi
          python scripts/check_project.py --version "$RELEASE_VERSION" "${flags[@]}"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [[ "$tag_commit" != "$RELEASE_COMMIT" ]]; then
              echo 'Existing tag points to a different commit.' >&2
              exit 1
            fi
          fi
          python scripts/build.py --kind source --channel "$package_channel" --version "$RELEASE_VERSION"
          python scripts/build.py --kind addin --channel "$package_channel" --version "$RELEASE_VERSION"
          if [[ "$package_channel" == release ]]; then
            source_archive="dist/Ejix-$RELEASE_VERSION-source.zip"
            addin_archive="dist/Ejix-$RELEASE_VERSION.zip"
          else
            source_archive="dist/Ejix-$RELEASE_VERSION-source-prerelease.zip"
            addin_archive="dist/Ejix-$RELEASE_VERSION-prerelease.zip"
          fi
          python scripts/release_contract.py --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" \
            --channel "$RELEASE_CHANNEL" --manifest Ejix/Ejix.manifest \
            --archive "$source_archive" --archive "$addin_archive" \
            --notes "$RUNNER_TEMP/release-notes.md"
      - name: Publish immutable release and automatic tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$RELEASE_CHANNEL" == prerelease ]]; then
            prerelease+=(--prerelease --latest=false)
          else
            prerelease+=(--latest)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Already published: $RELEASE_TAG"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT" || {
              echo "Existing tag belongs to another commit: $RELEASE_TAG" >&2
              exit 1
            }
          fi
          assets=(dist/*)
          if [[ -s "docs/releases/$RELEASE_VERSION.ru.md" ]]; then
            assets+=("docs/releases/$RELEASE_VERSION.ru.md")
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$RELEASE_COMMIT" --title "Ejix $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"
